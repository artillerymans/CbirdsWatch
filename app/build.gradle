plugins {
    id 'com.android.application' version '8.12.3'
    id 'org.jetbrains.kotlin.android' version '2.2.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
}

def localProperties = new Properties()
rootProject.file('local.properties').withInputStream { localProperties.load(it) }

def signingProperty = { name ->
    def value = localProperties.getProperty("signing.${name}")
    if (!value) {
        throw new GradleException("Missing signing.${name} in local.properties")
    }
    return value
}

android {
    namespace 'com.artillery.wallpaper.cbirds'
    compileSdk 35
    ndkVersion '30.0.16248370'

    signingConfigs {
        debug {
            storeFile file(signingProperty('storeFile'))
            storePassword signingProperty('storePassword')
            keyAlias signingProperty('keyAlias')
            keyPassword signingProperty('keyPassword')
        }
    }

    defaultConfig {
        applicationId 'com.artillery.wallpaper.cbirds'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // This project targets Android 9 for direct installation.
        warning.add('ExpiredTargetSdkVersion')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '4.1.2'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "${rootProject.name}-v${variant.versionName}-${variant.name}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}